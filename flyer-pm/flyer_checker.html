<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전단 PM 체커</title>
<meta name="theme-color" content="#0c3454">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--n:#0c3454;--n2:#1d5a8a;--ac:#e0442a;--bg:#f1f4f8;--card:#fff;--tx:#111827;--tx2:#4b5563;--tx3:#9ca3af;--bd:#d8dee6;--ok:#15803d;--okb:#dcfce7;--red:#dc2626;--redb:#fee2e2;--wait:#b45309;--waitb:#fef3c7;--info:#1d4ed8;--infob:#dbeafe}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit}
.top{background:var(--n);color:#fff}
.top .in{max-width:1320px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;letter-spacing:-.3px}
.top h1 small{font-weight:500;opacity:.7;font-size:12px;margin-left:6px}
.top .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top select,.top .tb{font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.top select option{color:#111}
.top .tb.pri{background:#fff;color:var(--n);border-color:#fff}
.demo{background:#fef3c7;color:#92400e;font-size:12.5px;text-align:center;padding:5px 12px}
.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:12px}
.ct{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ct small{font-weight:500;color:var(--tx2);font-size:12px}
.ct .sp{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kpi .l{font-size:12px;color:var(--tx2);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--tx3)}
.tw{overflow-x:auto}
table.sum{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:980px}
table.sum th{background:#eef2f7;color:var(--n);font-weight:800;padding:6px 6px;border:1px solid #dfe5ec;font-size:12px;white-space:nowrap}
table.sum td{padding:6px 8px;border:1px solid #edf0f4;text-align:right}
table.sum td:first-child{text-align:left;font-weight:800}
table.sum tr.tot td{background:#f7f9fb;font-weight:800}
table.sum tbody tr{cursor:pointer}
table.sum tbody tr:hover td{background:#f5f9ff}
table.sum tr.on td{background:#eaf2fb}
table.sum .z{color:#cbd2da}
.pct{font-size:11.5px;color:var(--tx2)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:16px;border:1px solid var(--bd);background:#fff;color:var(--tx2);cursor:pointer}
.chip.on{background:var(--n);border-color:var(--n);color:#fff}
.chip b{font-weight:900;margin-left:3px}
.srch{font-size:13px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;min-width:200px}
.btn{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--tx);cursor:pointer}
.btn:hover{border-color:var(--n2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:#fff;border-color:#fca5a5;color:var(--red)}
.btn.pri{background:var(--n);border-color:var(--n);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.rc{background:#fff;border-radius:14px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.06);padding:12px;display:flex;flex-direction:column;gap:8px}
.rc.s-ok{border-color:#bbf7d0}.rc.s-no{border-color:#fecaca}
.rc .hd{display:flex;gap:8px;align-items:flex-start}
.rc .nm{font-size:15.5px;font-weight:800;line-height:1.3}
.rc .sub{font-size:12.5px;color:var(--tx2)}
.rc .hd .r{margin-left:auto;text-align:right;white-space:nowrap}
.rc .pr{font-size:16px;font-weight:900;color:var(--ac)}
.ph4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ph4 .p{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#f1f3f6;cursor:pointer;border:1px solid #e5e7eb}
.ph4 .p img{width:100%;height:100%;object-fit:cover;display:block}
.ph4 .p .lb{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 5px}
.ph4 .p.x{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--tx3);font-size:11px;font-weight:700;cursor:default;border-style:dashed}
.ph4 .p.x.must{color:var(--red);border-color:#fca5a5;background:#fff5f5}
.ph4 .p .fl{position:absolute;top:3px;left:3px;font-size:10px;font-weight:800;background:var(--red);color:#fff;border-radius:6px;padding:0 5px}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 10px;font-size:12.5px}
.kv span{color:var(--tx3)}
.ws{display:flex;flex-direction:column;gap:3px}
.w{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px}
.w.err{background:var(--redb);color:#991b1b}.w.warn{background:var(--waitb);color:#92400e}.w.info{background:var(--infob);color:var(--info)}
.bd{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:10px}
.bd.ok{background:var(--okb);color:var(--ok)}.bd.no{background:var(--redb);color:var(--red)}.bd.wait{background:var(--waitb);color:var(--wait)}
.jd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px solid #f0f2f5;padding-top:8px;margin-top:auto}
.jd .who{font-size:11px;color:var(--tx3);margin-left:auto}
.rsn{background:#fff7f6;border:1px solid #fecaca;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.rsn .chips{display:flex;flex-wrap:wrap;gap:5px}
.rsn .chips button{font-size:12px;font-weight:700;padding:4px 9px;border-radius:12px;border:1px solid #fca5a5;background:#fff;color:#991b1b;cursor:pointer}
.rsn .chips button.on{background:var(--red);color:#fff;border-color:var(--red)}
.rsn input{font-size:13px;padding:6px 8px;border:1px solid var(--bd);border-radius:7px;width:100%}
.empty{padding:40px;text-align:center;color:var(--tx3);background:#fff;border-radius:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* 라이트박스 */
.lbx{position:fixed;inset:0;background:rgba(8,15,25,.94);z-index:50;display:none;grid-template-columns:1fr 340px;color:#fff}
.lbx.on{display:grid}
.lbx .stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.lbx .tabs{display:flex;gap:6px;padding:10px 14px}
.lbx .tabs button{font-size:13px;font-weight:800;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#cbd5e1;cursor:pointer}
.lbx .tabs button.on{background:#fff;color:var(--n)}
.lbx .tabs button:disabled{opacity:.3}
.lbx .img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;cursor:zoom-in}
.lbx .img img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s}
.lbx .img.zm{cursor:zoom-out}.lbx .img.zm img{transform:scale(2.2)}
.lbx .side{background:#0f1b2b;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.lbx .side .nm{font-size:18px;font-weight:800}
.lbx .side .kv{color:#e5e7eb}
.lbx .side .kv span{color:#94a3b8}
.lbx .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:24px;cursor:pointer}
.lbx .nav.l{left:10px}.lbx .nav.r{right:10px}
.lbx .cls{position:absolute;top:10px;right:12px;font-size:22px;background:none;border:0;color:#fff;cursor:pointer}
.lbx .keys{font-size:11.5px;color:#94a3b8;margin-top:auto}
.lbx .keys b{background:#1e293b;border-radius:4px;padding:0 5px;color:#e2e8f0}
.lbx .rsn{background:#1e293b;border-color:#7f1d1d}
.lbx .rsn input{background:#0f172a;color:#fff;border-color:#334155}
/* 모달 */
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.mdl.on{display:flex}
.mdl .box{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.mdl h3{margin:0 0 10px;font-size:16px}
.mdl label{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin:10px 0 4px}
.mdl input,.mdl textarea{width:100%;font-size:13.5px;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;font-family:inherit}
.mdl textarea{min-height:110px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lnkt{width:100%;border-collapse:collapse;font-size:12.5px}
.lnkt td{border-top:1px solid #eef0f3;padding:5px 4px}
.lnkt td:nth-child(2){color:var(--tx2);word-break:break-all}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(3,1fr)} .list{grid-template-columns:1fr} .lbx{grid-template-columns:1fr;grid-template-rows:1fr auto} .lbx .side{max-height:45vh} }
</style>
</head>
<body>
<div class="demo" id="demo" style="display:none"></div>
<div class="top"><div class="in"><h1>전단 PM 체커 <small id="rule">영업지원팀 · 별도매대 전단행사 검토</small></h1>
  <div class="sp"><select id="mon" onchange="setMonth(this.value)"></select>
  <button class="tb" onclick="load(true)">↻ 새로고침</button><button class="tb" onclick="openLinks()">🔗 영업소 링크</button><button class="tb" onclick="openImp()">📥 과거 자료</button><button class="tb" onclick="openCfg()">⚙ 설정</button><button class="tb pri" onclick="exportXlsx()">⬇ 엑셀 취합 다운로드</button></div></div></div>
<div class="wrap" id="app"><div class="empty">불러오는 중...</div></div>
<div class="lbx" id="lbx"></div>
<div class="mdl" id="mdl" onclick="if(event.target===this)closeMdl()"><div class="box" id="mdlb"></div></div>
<div class="toast" id="toast"></div>

<script>
// ═════════ 설정 ═════════
var GAS_URL = '';   // flyer_pm_gas.gs 웹 앱 주소 — 영업소 페이지(flyer_pm.html)와 같은 주소. 비우면 데모 모드
var INPUT_PAGE = 'flyer_pm.html';
var OFFICES = ['동부','서부','남부','북부','강원','충청','전북','전남','경북','경남','부산'];
var SLOTS = [{k:'event',l:'행사사진',must:1},{k:'front',l:'전단 앞면',must:1},{k:'back',l:'전단 뒷면',must:0},{k:'zoom',l:'확대컷',must:1}];
var GRADES = ['SA','A','B','C'];
var CFG = {pmBox:5,boxUnit:485,boxIpsu:24,pmProduct:'검은콩고칼슘24',
  products:[{n:'검은참깨(미드)190-24G',i:24},{n:'검은참깨고칼슘(미드)190-24G',i:24},{n:'검은콩&16곡(미드)190-24',i:24},{n:'검은콩16곡(파)190-15G',i:15},{n:'검은콩두유고칼슘(파)190-15G',i:15},{n:'검은콩아몬드&호두(미드)190-24',i:24},{n:'검은콩아몬드와호두(파)190-15G',i:15},{n:'검은콩저당두유(미드)190-24',i:24},{n:'고소한베지밀(파)190-15G',i:15},{n:'달콤한B(미드)190-64G',i:16},{n:'담백한A(미드)190-64G',i:16},{n:'뼈에좋은검은콩(미드)190-24G',i:24},{n:'플레인고칼슘두유(미드)190-24G',i:24}],
  reasons:['별도매대 아님(본매대·일반매대)','사진 없음·부족','전월(이전) 사진','중복 사진','전월 PM 중복 (같은 전단)','전단 가격 불일치','행사기간 불일치','전단에 자사 제품 없음'],notice:''};
var DEMO = !GAS_URL;
var PERIOD = ['2026-04','2026-12'];   // 전단 PM 진행 기간 (체커 월 목록)
var CHECK_FROM = '2026-11';         // 이 달부터 영업소 직접 입력 · 이전 달은 과거 자료 이관

// ═════════ 유틸 ═════════
function $(id){ return document.getElementById(id); }
function ls(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lss(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s||'').replace(/\s|\(주\)|주식회사|㈜|점$/g,'').toLowerCase(); }
function kst(){ var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000); }   // 이 기기(컴퓨터·휴대폰)의 현재 시각
function mRange(m){ var d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)); return [m+'-01',d.toISOString().slice(0,10)]; }
function overlaps(s,e,m){ if(!s||!e) return false; var R=mRange(m); return s<=R[1]&&e>=R[0]; }   // 그 달에 하루라도 걸치면 인정 (예: 10/28~11/5 → 11월 가능)
function nowStr(){ return kst().toISOString().slice(0,16).replace('T',' '); }
function ym(off){ var d=kst(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+(off||0)); return d.toISOString().slice(0,7); }
function won(n){ n=+n; return isFinite(n)&&n?Math.round(n).toLocaleString('ko-KR'):''; }
function n0(v){ var n=parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n)?n:0; }
function md(d){ return d?String(d).slice(5).replace('-','/'):''; }
function addDays(d,n){ var t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5); }
function ipsuOf(p){ p=String(p||''); var f=CFG.products.filter(function(x){ return p.indexOf(x.n)===0; })[0]; if(f) return f.i; var m=p.match(/-(\d{2})G?\b/); if(m){ var n=+m[1]; return n===64?16:n; } return ''; }
function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(function(){ e.classList.remove('on'); },2200); }
function pctTxt(a,b){ if(!b) return ''; var p=(a-b)/b*100; return (p>0?'+':'')+Math.round(p)+'%'; }
var KEY=ls('fpc_key',''), USER=ls('fpc_user','영업지원팀');

// ═════════ 서버 ═════════
function apiGet(p){
  if(DEMO) return Promise.resolve(demoGet(p));
  var q=Object.keys(p).map(function(k){ return k+'='+encodeURIComponent(p[k]); }).join('&');
  return fetch(GAS_URL+'?'+q).then(function(r){ return r.json(); });
}
function apiPost(b){ if(DEMO) return Promise.resolve(demoPost(b)); b.key=KEY; return fetch(GAS_URL,{method:'POST',body:JSON.stringify(b)}).then(function(r){ return r.json(); }); }
function demoRows(){ return ls('fp_demo_rows',null); }
function demoGet(p){
  var rows=demoRows(); if(!rows){ demoSeed(); rows=demoRows()||[]; }
  if(p.action==='fpAll'){ var m={}; rows.forEach(function(r){ m[r.month]=(m[r.month]||0)+1; }); return {success:true,rows:rows.filter(function(r){ return r.month===p.month; }),months:m,cfg:ls('fp_demo_cfg',null)||CFG}; }
  return {success:false};
}
function demoPost(b){
  var rows=demoRows()||[];
  if(b.action==='fpJudge'){ var ids=b.ids||[b.id]; rows.forEach(function(r){ if(ids.indexOf(r.id)>=0){ r.status=b.status||''; r.reason=b.status==='부적합'?(b.reason||''):''; r.judgedBy=b.user; r.judgedAt=b.status?nowStr():''; } }); lss('fp_demo_rows',rows); return {success:true}; }
  if(b.action==='fpCfgSet'){ lss('fp_demo_cfg',b.cfg); return {success:true,cfg:b.cfg}; }
  if(b.action==='fpImport'){ (b.rows||[]).forEach(function(r){ var o=rows.filter(function(x){ return x.id===r.id; })[0]; if(!o){ o={id:r.id,photos:{},createdAt:nowStr()}; rows.push(o); } Object.keys(r).forEach(function(k){ o[k]=r[k]; }); o.updatedAt=nowStr(); }); if(!lss('fp_demo_rows',rows)) return {success:false,msg:'데모 저장 공간 부족'}; return {success:true,n:(b.rows||[]).length}; }
  if(b.action==='fpSave'){ var o=rows.filter(function(x){ return x.id===b.row.id; })[0]; if(!o) return {success:false,msg:'없는 건'}; Object.keys(b.photos||{}).forEach(function(k){ var p=b.photos[k]; o.photos[k]={fileId:'local',src:p.imageData,sha:p.sha,dhash:p.dhash,exif:p.exifDate,at:nowStr()}; }); if(!lss('fp_demo_rows',rows)) return {success:false,msg:'데모 저장 공간 부족 (데모에선 사진 일부만 넣어 보세요)'}; return {success:true,row:o}; }
  return {success:false};
}
// 데모 샘플(영업소 페이지와 동일) — 영업소 페이지를 먼저 열지 않았을 때만
function demoSeed(){
  if(ls('fp_demo_seeded',0)===2) return;
  var M=ym(), M0=ym(-1), P=CFG.products, rows=[], k=0;
  var marts=['행복마트','우리마트','하나로식자재','365마트','굿모닝마트','농협하나로','이마트에브리데이','탑마트','세일마트','킹마트','큰손식자재','동네마트'];
  var comp=['','','삼육 검은콩고칼슘 9,900원','','연세 뼈를생각한 12,900원','','삼육없음'];
  var why=['별도매대 아님(본매대·일반매대)','전월(이전) 사진','중복 사진','전단 가격 불일치'];
  OFFICES.forEach(function(of,oi){
    var n=3+((oi*7)%6);
    for(var i=0;i<n;i++){
      k++; var p=P[(k*5)%P.length], st=M+'-'+('0'+(1+((k*3)%20))).slice(-2), mo=(i===n-1&&oi%3===0)?M0:M;
      if(mo===M0) st=M0+'-'+('0'+(5+(k%15))).slice(-2);
      var miss=(k%7===0)?['back','zoom']:(k%5===0)?['back']:[];
      var photos={}; SLOTS.forEach(function(s){ if(miss.indexOf(s.k)<0) photos[s.k]={fileId:'demo:'+s.k+':'+k,sha:'demo'+s.k+k,dhash:'',exif:st+' 10:'+('0'+(k%60)).slice(-2),at:''}; });
