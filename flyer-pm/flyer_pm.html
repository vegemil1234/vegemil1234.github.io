<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>전단 PM 등록</title>
<meta name="theme-color" content="#0c3454">
<style>
:root{--n:#0c3454;--n2:#1d5a8a;--ac:#e0442a;--bg:#f3f5f8;--card:#fff;--tx:#111827;--tx2:#4b5563;--tx3:#9ca3af;--bd:#d1d5db;--ok:#15803d;--okb:#dcfce7;--red:#dc2626;--redb:#fee2e2;--wait:#b45309;--waitb:#fef3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 56px}
body.sheet .wrap{max-width:1400px}
.top{background:var(--n);color:#fff;padding:16px 16px 12px;text-align:center}
.top h1{margin:0;font-size:22px;letter-spacing:-.5px}
.top .sub{font-size:13px;opacity:.8;margin-top:2px}
.demo{background:#fef3c7;color:#92400e;font-size:13px;text-align:center;padding:6px 12px}
.who{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;color:var(--tx2);flex-wrap:wrap}
.who b{color:var(--n);font-size:18px}
.who .sp{margin-left:auto}
.sbtn{font-size:14px;padding:5px 10px;border:1px solid var(--bd);background:#fff;border-radius:8px;color:var(--tx2);cursor:pointer}
.months{display:flex;gap:6px;margin-top:10px}
.months button{flex:1;font-size:15px;font-weight:700;padding:8px 4px;border-radius:10px;border:2px solid var(--bd);background:#fff;color:var(--tx2);cursor:pointer}
.months button.on{border-color:var(--ac);color:var(--ac);background:#fff5f3}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;font-size:16px;font-weight:800;padding:11px 4px;border-radius:12px;border:2px solid var(--bd);background:#fff;color:var(--tx2);cursor:pointer}
.tabs button.on{border-color:var(--n);background:var(--n);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lab{font-size:17px;font-weight:800;margin-bottom:6px}
.lab small{font-weight:500;color:var(--tx2);font-size:13px;margin-left:4px}
.lab .req{color:var(--ac)}
.inp{width:100%;font-size:19px;padding:11px 12px;border:2px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font-family:inherit}
.inp:focus{outline:none;border-color:var(--n2)}
.row2>*,.row3>*{min-width:0}
input[type=date].inp{font-size:16px;padding:11px 8px;min-width:0}
select.inp{appearance:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{margin-top:12px}
.fld:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pick{font-size:18px;font-weight:700;padding:14px 8px;border:2px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);text-align:center;cursor:pointer}
.pick:hover{border-color:var(--n2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:15px;padding:6px 12px;border-radius:18px;border:1px solid var(--bd);background:#fff;color:var(--tx2);cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{font-size:18px;font-weight:800;padding:10px 0;border-radius:10px;border:2px solid var(--bd);background:#fff;color:var(--tx2);cursor:pointer}
.seg button.on{border-color:var(--n);background:var(--n);color:#fff}
.ac{border:2px solid var(--n2);border-top:0;border-radius:0 0 12px 12px;margin-top:-6px;padding-top:6px;max-height:260px;overflow:auto;background:#fff}
.ac div{padding:10px 12px;border-top:1px solid #eee;cursor:pointer}
.ac div:hover{background:#eef4fa}
.ac span{font-size:13px;color:var(--tx2);margin-left:6px}
.guide{font-size:14px;color:var(--tx2);margin:2px 0 8px}
.guide b{color:var(--tx)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border:2px dashed #b8c7d6;border-radius:14px;padding:10px;background:#f8fafc;display:flex;flex-direction:column;gap:6px;min-height:200px}
.slot.has{border-style:solid;border-color:#86efac;background:#f0fdf4}
.slot.drag,.dropall.drag{border-color:var(--n2)!important;border-style:solid!important;background:#e0ecf7!important;box-shadow:0 0 0 3px rgba(29,90,138,.2)}
.dropall{border:2px dashed #b8c7d6;border-radius:12px;padding:10px;text-align:center;font-size:14px;color:var(--tx2);margin-bottom:10px;background:#f8fafc}
.dropall b{color:var(--n)}
table.sh tr.drag td{background:#e0ecf7!important}
table.sh .pc button.drag{background:var(--n2);color:#fff;border-color:var(--n2)}
@media (hover:none){ .dropall{display:none} }
.slot .t{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.slot .t .must{font-size:11px;font-weight:700;color:var(--ac);border:1px solid #fbc4b8;border-radius:8px;padding:0 6px}
.slot .d{font-size:12.5px;color:var(--tx2);line-height:1.35}
.slot .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.slot .btns button{font-size:15px;font-weight:700;padding:10px 4px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.slot .btns button.cam{background:var(--n);color:#fff;border-color:var(--n)}
.slot .im{position:relative;border-radius:10px;overflow:hidden;background:#e5e7eb;aspect-ratio:4/3}
.slot .im img{width:100%;height:100%;object-fit:cover;display:block}
.slot .im .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:17px;cursor:pointer}
.slot .warn{font-size:12px;color:var(--red);font-weight:700}
.slot .meta{font-size:11.5px;color:var(--tx3)}
.big{display:block;width:100%;font-size:20px;font-weight:800;padding:15px;border:0;border-radius:14px;cursor:pointer;font-family:inherit}
.go{background:var(--n);color:#fff;margin-top:14px}
.go:disabled{background:#9ca3af}
.ghost{background:#fff;color:var(--tx2);border:2px solid var(--bd);margin-top:8px;font-size:16px;padding:11px}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:16px;display:none}
.msg.err{display:block;background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.msg.ok{display:block;background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0}
.msg.warn{display:block;background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.q{position:sticky;top:0;z-index:20;background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;font-size:14px;padding:7px 16px;text-align:center;display:none}
.q button{font-size:13px;margin-left:8px;padding:2px 10px;border-radius:8px;border:1px solid currentColor;background:#fff;color:inherit}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat div{background:#f8fafc;border-radius:10px;padding:8px 2px}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1.2}
.stat span{font-size:12.5px;color:var(--tx2)}
.it{display:flex;gap:10px;padding:12px 0;border-top:1px solid #eee}
.it:first-child{border-top:0}
.it .th{width:76px;height:76px;border-radius:10px;object-fit:cover;background:#e5e7eb;flex:none}
.it .nm{font-size:17px;font-weight:800}
.it .s{font-size:13.5px;color:var(--tx2)}
.bd{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;margin-right:4px}
.bd.ok{background:var(--okb);color:var(--ok)}.bd.no{background:var(--redb);color:var(--red)}.bd.wait{background:var(--waitb);color:var(--wait)}.bd.ph{background:#e0ecf7;color:var(--n)}.bd.phx{background:#fee2e2;color:var(--red)}
.it .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.it .acts button{font-size:14px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.it .acts button.del{color:var(--red);border-color:#fecaca}
.it .why{font-size:13.5px;color:var(--red);margin-top:2px;font-weight:700}
/* 시트 */
.shbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shbar .sp{margin-left:auto}
.shwrap{overflow:auto;max-height:70vh;margin-top:10px;border:1px solid var(--bd);border-radius:10px;background:#fff}
table.sh{border-collapse:separate;border-spacing:0;font-size:14px;min-width:1500px;width:100%}
table.sh th{position:sticky;top:0;z-index:2;background:#e8eef5;color:var(--n);font-weight:800;padding:7px 6px;border-bottom:2px solid #b8c7d6;border-right:1px solid #d5dfe9;white-space:nowrap;font-size:13px}
table.sh th.r{background:#fde8e3;color:#9a2b16}
table.sh td{border-bottom:1px solid #e5e7eb;border-right:1px solid #eef0f3;padding:0;vertical-align:middle}
table.sh td.no{text-align:center;color:var(--tx3);font-size:12px;width:36px;background:#fafbfc}
table.sh input,table.sh select{width:100%;border:0;padding:8px 6px;font-size:14px;font-family:inherit;background:transparent;color:var(--tx);min-width:60px}
table.sh input:focus,table.sh select:focus{outline:2px solid var(--n2);outline-offset:-2px;background:#f5f9ff}
table.sh tr.dirty td{background:#fffbeb}
table.sh tr.dirty td.no{background:#fde68a;color:#92400e;font-weight:800}
table.sh tr.lock td{background:#f0fdf4}
table.sh tr.lock input,table.sh tr.lock select{color:var(--tx2)}
table.sh tr.bad td.no{background:var(--redb);color:var(--red)}
table.sh .pc{display:flex;gap:3px;padding:3px 4px}
table.sh .pc button{font-size:12px;font-weight:800;width:30px;height:28px;border-radius:6px;border:1px solid var(--bd);background:#fff;color:var(--tx3);cursor:pointer;padding:0}
table.sh .pc button.on{background:var(--okb);border-color:#86efac;color:var(--ok)}
table.sh .st{font-size:12px;padding:0 6px;white-space:nowrap}
table.sh .delr{border:0;background:none;color:var(--tx3);font-size:16px;cursor:pointer;padding:4px 8px}
.lnk{color:var(--n2);font-size:14px;text-decoration:underline;background:none;border:0;cursor:pointer;padding:0}
.foot{text-align:center;font-size:12px;color:var(--tx3);margin-top:24px}
@media (max-width:420px){ .slots{grid-template-columns:1fr 1fr;gap:8px} .slot{padding:8px} .row3{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>
<body>
<div class="q" id="qbar"></div>
<div class="demo" id="demo" style="display:none"></div>
<div class="top"><h1>베지밀 전단 PM 등록</h1><div class="sub">별도매대 전단행사 · 행사사진 · 전단 앞/뒷면 · 확대컷</div></div>
<div class="wrap" id="app"></div>
<input id="f-cam" type="file" accept="image/*" capture="environment" style="display:none">
<input id="f-alb" type="file" accept="image/*" style="display:none">

<script>
// ═════════ 설정 ═════════
// ① flyer_pm_gas.gs 를 웹 앱으로 배포한 주소(…/exec)를 넣으세요. 비워 두면 '데모 모드'(이 브라우저에만 저장)로 동작합니다.
var GAS_URL = '';
// ② 시장조사 체커 서버 — 영업소별 대리점·점포·담당자 목록을 자동완성용으로 읽어 옵니다(읽기만 함).
var MC_URL = 'https://script.google.com/macros/s/AKfycbx_N_Qsf-3hnfU1V1Htx3suCHc-uvfqVfHNOnmTRDQdVyflwzcW-J_1kdHO327iArEu/exec';

var OFFICES = ['동부','서부','남부','북부','강원','충청','전북','전남','경북','경남','부산'];
var SLOTS = [
  {k:'event', l:'행사사진', d:'별도매대 <b>전경</b> — 매대·가격표가 다 보이게', must:1},
  {k:'front', l:'전단 앞면', d:'전단지 <b>앞면 전체</b>가 보이게 펴서', must:1},
  {k:'back',  l:'전단 뒷면', d:'전단지 <b>뒷면 전체</b>', must:0},
  {k:'zoom',  l:'확대컷',   d:'전단 속 <b>베지밀 품목·가격</b> 부분 확대', must:1}
];
var GRADES = ['SA','A','B','C'];
var CFG = {products:[
  {n:'검은참깨(미드)190-24G',i:24},{n:'검은참깨고칼슘(미드)190-24G',i:24},{n:'검은콩&16곡(미드)190-24',i:24},{n:'검은콩16곡(파)190-15G',i:15},
  {n:'검은콩두유고칼슘(파)190-15G',i:15},{n:'검은콩아몬드&호두(미드)190-24',i:24},{n:'검은콩아몬드와호두(파)190-15G',i:15},{n:'검은콩저당두유(미드)190-24',i:24},
  {n:'고소한베지밀(파)190-15G',i:15},{n:'달콤한B(미드)190-64G',i:16},{n:'담백한A(미드)190-64G',i:16},{n:'뼈에좋은검은콩(미드)190-24G',i:24},{n:'플레인고칼슘두유(미드)190-24G',i:24}],
  notice:''};
var DEMO = !GAS_URL;
var INPUT_FROM = '2026-11', INPUT_TO = '2026-12';   // 영업소가 입력할 수 있는 행사월 (4~10월은 영업지원팀이 이관)
function inputMonths(){ var L=[ym(-1),ym(),ym(1)].filter(function(m){ return m>=INPUT_FROM&&m<=INPUT_TO; }); return L.length?L:[ym()]; }

// ═════════ 유틸 ═════════
function $(id){ return document.getElementById(id); }
function ls(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lss(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s||'').replace(/\s|\(주\)|주식회사|㈜/g,'').toLowerCase(); }
function kst(){ var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000); }   // 이 기기(컴퓨터·휴대폰)의 현재 시각
function mRange(m){ var d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)); return [m+'-01',d.toISOString().slice(0,10)]; }
function overlaps(s,e,m){ if(!s||!e) return false; var R=mRange(m); return s<=R[1]&&e>=R[0]; }   // 그 달에 하루라도 걸치면 인정 (예: 10/28~11/5 → 11월 가능)
function today(){ return kst().toISOString().slice(0,10); }
function nowStr(){ return kst().toISOString().slice(0,16).replace('T',' '); }
function ym(off){ var d=kst(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+(off||0)); return d.toISOString().slice(0,7); }
function mLabel(m){ return +m.slice(5,7)+'월'; }
function mHint(m){ var R=mRange(m), p=new Date(R[0]+'T00:00:00Z'); p.setUTCDate(p.getUTCDate()-4); return md(p.toISOString().slice(0,10))+'~'+md(R[0].slice(0,8)+'05')+' 가능'; }
function won(n){ n=+n; return n?n.toLocaleString('ko-KR'):''; }
function num(v){ var n=String(v==null?'':v).replace(/[^\d.\-]/g,''); return n===''?'':+n; }
function addDays(d,n){ var t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function md(d){ return d?d.slice(5).replace('-','/'):''; }
function normDate(v,month){   // '2026.10.9' '10/9' '10-09' '20261009' → YYYY-MM-DD
  var s=String(v||'').trim(); if(!s) return ''; var y=(month||ym()).slice(0,4), m;
  if((m=s.match(/^(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/))) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{1,2})[.\-\/월\s]+(\d{1,2})/))) return y+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  if(/^\d{5}$/.test(s)){ var t=new Date(Date.UTC(1899,11,30)+(+s)*864e5); return t.toISOString().slice(0,10); }   // 엑셀 날짜 숫자
  return s;
}
function ipsuOf(p){ p=String(p||''); var f=CFG.products.filter(function(x){ return p.indexOf(x.n)===0; })[0]; if(f) return f.i; var m=p.match(/-(\d{2})G?\b/); if(m){ var n=+m[1]; return n===64?16:n; } return ''; }
var DEV=ls('fp_dev',''); if(!DEV){ DEV='d'+Math.random().toString(36).slice(2,10); lss('fp_dev',DEV); }

// ═════════ 서버 (데모: 이 브라우저 localStorage) ═════════
function apiGet(params){
  if(DEMO) return Promise.resolve(demoGet(params));
  var q=Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(GAS_URL+'?'+q).then(function(r){ return r.json(); });
}
function apiPost(body){
  if(DEMO) return new Promise(function(ok){ setTimeout(function(){ ok(demoPost(body)); },250); });
  var ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ctl) ctl.abort(); },120000);
  return fetch(GAS_URL,{method:'POST',body:JSON.stringify(body),signal:ctl?ctl.signal:undefined}).then(function(r){ clearTimeout(to); return r.json(); },function(e){ clearTimeout(to); throw e; });
}
function demoRows(){ demoSeed(); return ls('fp_demo_rows',[]); }
function demoSave(rows){ if(!lss('fp_demo_rows',rows)) throw new Error('데모 저장 공간이 가득 찼어요 (사진을 줄이거나 데모 초기화)'); }
function demoGet(p){
  if(p.action==='fpCfg') return {success:true,cfg:ls('fp_demo_cfg',null)||CFG};
  if(p.action==='fpList') return {success:true,rows:demoRows().filter(function(r){ return r.office===p.office&&(!p.month||r.month===p.month); })};
  return {success:false,msg:'demo'};
}
function demoPost(b){
  var rows=demoRows();
  if(b.action==='fpSave'){
    var r=b.row, cur=rows.filter(function(x){ return x.id===(r.id||b.clientId); })[0];
    if(cur&&cur.status==='적합') return {success:false,msg:'이미 적합 판정된 건은 고칠 수 없습니다. 영업지원팀에 문의해 주세요'};
    var o=cur||{id:b.clientId||('fp'+Date.now().toString(36)),createdAt:nowStr(),photos:{},status:'',reason:''};
    Object.keys(r).forEach(function(k){ if(k!=='id') o[k]=r[k]; });
    Object.keys(b.photos||{}).forEach(function(s){ var p=b.photos[s]; if(p===null) delete o.photos[s]; else o.photos[s]={fileId:'local',src:p.imageData,sha:p.sha,dhash:p.dhash,exif:p.exifDate,lm:p.lastModified,at:nowStr()}; });
    if(cur&&cur.status==='부적합'){ o.status=''; o.reason='(수정됨) '+(cur.reason||''); }
    o.updatedAt=nowStr(); if(!cur) rows.push(o);
    try{ demoSave(rows); }catch(e){ return {success:false,msg:e.message}; }
    return {success:true,row:o};
  }
  if(b.action==='fpDel'){ var t=rows.filter(function(x){ return x.id===b.id; })[0]; if(t&&t.status==='적합') return {success:false,msg:'적합 판정된 건은 삭제할 수 없습니다'}; demoSave(rows.filter(function(x){ return x.id!==b.id; })); return {success:true}; }
  return {success:false,msg:'demo'};
}
// 데모용 샘플 — 실제 데이터 아님
function demoSeed(){
  if(ls('fp_demo_seeded',0)===2) return;

    var n=phCount(r), mm=mustMiss(r), ev=r.photos&&(r.photos.event||r.photos.front||r.photos.zoom);

      '<div style="flex:1;min-width:0"><div class="nm">'+esc(r.store)+'</div><div class="s">'+esc(r.agency)+' · '+esc(r.grade||'')+' · '+md(r.start)+'~'+md(r.end)+'</div><div class="s">'+esc(r.product)+' · <b>'+won(r.price)+'원</b></div>'+
      '<div style="margin-top:4px">'+stBadge(r)+'<span class="bd '+(mm.length?'phx':'ph')+'">📷 '+n+'/4</span>'+(mm.length?'<span style="font-size:12px;color:var(--red)">'+mm.map(function(s){ return s.l; }).join('·')+' 없음</span>':'')+'</div>'+
      (r.status==='부적합'&&r.reason?'<div class="why">사유: '+esc(r.reason)+'</div>':'')+(r.status===''&&/^\(수정됨\)/.test(r.reason||'')?'<div class="s" style="color:var(--wait)">고친 내용 재검토 중</div>':'')+
      (r.status!=='적합'?'<div class="acts"><button onclick="editRow(\''+r.id+'\')">✏️ 수정·사진 추가</button><button class="del" onclick="delRow(\''+r.id+'\')">🗑 삭제</button></div>':'')+
      '</div></div>';
  }).join('')+'</div><div style="text-align:center;margin-top:10px"><button class="lnk" onclick="V.rows=null;loadRows();render()">↻ 새로고침</button></div>';
  return h;
}
function delRow(id){
  var r=(V.rows||[]).filter(function(x){ return x.id===id; })[0]; if(!r) return;
  if(!confirm('\''+r.store+'\' 등록을 삭제할까요? 사진도 같이 지워집니다.')) return;
  apiPost({action:'fpDel',id:id,office:ME.office}).then(function(d){ if(d&&d.success){ V.rows=V.rows.filter(function(x){ return x.id!==id; }); render(); } else alert((d&&d.msg)||'삭제하지 못했어요'); }).catch(function(){ alert('인터넷 연결을 확인해 주세요'); });
}

// ═════════ 시트 입력 (엑셀처럼 여러 행) ═════════
var SC=[ // 열: 취합 파일과 같은 순서
  {k:'agency',l:'대리점명',w:120,req:1},{k:'store',l:'점포명',w:170,req:1},{k:'price',l:'행사가격',w:90,req:1,t:'num'},
  {k:'start',l:'행사시작일',w:120,req:1,t:'date'},{k:'end',l:'행사종료일',w:120,req:1,t:'date'},{k:'product',l:'품목명',w:240,req:1,t:'prod'},
  {k:'ipsu',l:'입수',w:56,t:'num'},{k:'grade',l:'점포등급',w:70,t:'grade'},{k:'competitor',l:'타사행사내역',w:200},
  {k:'salesNone',l:'미행사시 판매량',w:80,t:'num'},{k:'salesNormal',l:'일반행사시 판매량',w:80,t:'num'},{k:'salesFlyer',l:'전단기간 판매량',w:80,t:'num'},{k:'note',l:'비고',w:140}
];
function sheetInit(){
  if(V.sheet) return;
  var rows=(V.rows||[]).slice().sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); }).map(sRowFrom);
  for(var i=0;i<(rows.length?5:12);i++) rows.push(blankSRow());
  V.sheet=rows;
}
function sRowFrom(r){ var o={id:r.id,status:r.status,reason:r.reason,photos:Object.assign({},r.photos||{}),nph:{},dirty:false,saving:!!r._pending}; SC.forEach(function(c){ o[c.k]=r[c.k]==null?'':r[c.k]; }); return o; }
function blankSRow(){ var o={id:'',status:'',photos:{},nph:{},dirty:false}; SC.forEach(function(c){ o[c.k]=c.k==='grade'?'':''; }); return o; }
function sheetDirty(){ return (V.sheet||[]).filter(function(r){ return r.dirty; }); }
function sheetMerge(r){ if(!V.sheet) return; var s=V.sheet.filter(function(x){ return x.id===r.id||x._cid===r.id; })[0]; if(s){ s.id=r.id; s.status=r.status; s.photos=Object.assign({},r.photos||{}); s.nph={}; s.saving=false; drawSheetBody(); } else if(!sheetDirty().length){ V.sheet=null; render(); } else { var o=sRowFrom(r), k=V.sheet.length; while(k>0&&!V.sheet[k-1].id&&!V.sheet[k-1].dirty) k--; V.sheet.splice(k,0,o); drawSheetBody(); } }
function viewSheet(){
  if(V.rows===null) return '<div class="card"><div class="guide">불러오는 중...</div></div>';
  sheetInit();
  var h='<div class="card"><div class="shbar"><div><div class="lab" style="margin:0">'+esc(ME.office)+'영업소 '+mLabel(MONTH)+' 전단 프로모션 현황</div><div class="guide" style="margin:0">엑셀에서 여러 칸을 복사해 <b>대리점명 칸에 붙여넣기(Ctrl+V)</b> 하면 한 번에 채워집니다. 사진은 행마다 <b>행·앞·뒤·확</b> 버튼.</div></div>'+
    '<div class="sp" style="display:flex;gap:6px;flex-wrap:wrap"><button class="sbtn" onclick="sheetAdd(10)">+ 10행</button><button class="big go" id="sh-save" style="margin:0;width:auto;font-size:16px;padding:10px 18px" onclick="sheetSave()">저장</button></div></div>'+
    '<datalist id="dl-ag2">'+agencies().map(function(a){ return '<option value="'+esc(a)+'">'; }).join('')+'</datalist><datalist id="dl-pr">'+CFG.products.map(function(p){ return '<option value="'+esc(p.n)+'">'; }).join('')+'</datalist>'+
    '<div class="shwrap"><table class="sh"><thead><tr><th>No.</th>'+SC.map(function(c){ return '<th class="'+(c.req?'r':'')+'" style="min-width:'+c.w+'px">'+c.l+(c.req?' *':'')+'</th>'; }).join('')+'<th>사진 (행사·앞·뒤·확대)<br><span style="font-weight:500;font-size:11px">행에 끌어다 놓기 가능</span></th><th>상태</th><th></th></tr></thead><tbody id="sh-body"></tbody></table></div>'+
    '<div class="msg" id="msg"></div></div>';
  return h;
}
function cellHtml(r,c,i){
  var v=r[c.k]==null?'':r[c.k], lock=r.status==='적합'?' disabled':'', a=' data-r="'+i+'" data-k="'+c.k+'"'+lock;
  if(c.t==='grade') return '<select'+a+'><option value=""></option>'+GRADES.map(function(g){ return '<option'+(v===g?' selected':'')+'>'+g+'</option>'; }).join('')+'</select>';
  if(c.t==='date') return '<input type="date"'+a+' value="'+esc(normDate(v,MONTH))+'">';
  if(c.t==='num') return '<input inputmode="numeric"'+a+' value="'+esc(c.k==='price'?won(v):v)+'" style="text-align:right">';
  if(c.t==='prod') return '<input list="dl-pr"'+a+' value="'+esc(v)+'">';
  if(c.k==='agency') return '<input list="dl-ag2"'+a+' value="'+esc(v)+'">';
  return '<input'+a+' value="'+esc(v)+'">';
}
function drawSheetBody(){
  var tb=$('sh-body'); if(!tb||!V.sheet) return;
  tb.innerHTML=V.sheet.map(function(r,i){
    var cls=(r.status==='적합'?'lock ':'')+(r.dirty?'dirty ':'')+(r.bad?'bad':'');
    var st=r.saving?'<span class="bd wait">저장 중</span>':r.id?(r.status==='적합'?'<span class="bd ok">적합</span>':r.status==='부적합'?'<span class="bd no" title="'+esc(r.reason||'')+'">부적합</span>':'<span class="bd wait">대기</span>'):'';
    return '<tr class="'+cls+'"><td class="no">'+(i+1)+'</td>'+SC.map(function(c){ return '<td>'+cellHtml(r,c,i)+'</td>'; }).join('')+
      '<td><div class="pc">'+SLOTS.map(function(s,j){ var on=r.nph[s.k]||r.photos[s.k]; return '<button class="'+(on?'on':'')+'" title="'+s.l+'" onclick="sheetPhoto('+i+',\''+s.k+'\')"'+(r.status==='적합'?' disabled':'')+'>'+['행','앞','뒤','확'][j]+'</button>'; }).join('')+'</div></td>'+
      '<td class="st">'+st+(r.status==='부적합'&&r.reason?'<div style="font-size:11px;color:var(--red);max-width:150px;white-space:normal">'+esc(r.reason)+'</div>':'')+'</td>'+
      '<td>'+(r.status!=='적합'?'<button class="delr" title="행 비우기/삭제" onclick="sheetDel('+i+')">✕</button>':'')+'</td></tr>';
  }).join('');
  var b=$('sh-save'); if(b){ var n=sheetDirty().length; b.textContent=n?'변경 '+n+'행 저장':'저장'; b.disabled=!n; }
}
function bindSheet(){
  drawSheetBody();
  var tb=$('sh-body'); if(!tb) return;
  var cur=null, clr=function(){ [].forEach.call(tb.querySelectorAll('.drag'),function(x){ x.classList.remove('drag'); }); };
  tb.addEventListener('dragover',function(e){ e.preventDefault(); var tr=e.target.closest&&e.target.closest('tr'), bt=e.target.closest&&e.target.closest('.pc button'); var key=(tr?tr.rowIndex:'')+'|'+(bt?bt.title:''); if(key===cur) return; cur=key; clr(); if(tr) tr.classList.add('drag'); if(bt) bt.classList.add('drag'); });
  tb.addEventListener('dragleave',function(e){ if(!tb.contains(e.relatedTarget)){ cur=null; clr(); } });
  tb.addEventListener('drop',function(e){ e.preventDefault(); e.stopPropagation(); cur=null; clr();
    var tr=e.target.closest&&e.target.closest('tr'); if(!tr) return; var i=tr.rowIndex-1, r=V.sheet[i]; if(!r) return;
    if(r.status==='적합'){ alert('적합 판정된 행은 사진을 바꿀 수 없어요.'); return; }
    var bt=e.target.closest('.pc button'), slot=bt?(SLOTS.filter(function(s){ return s.l===bt.title; })[0]||{}).k:'';
    var fs=imgFiles(e.dataTransfer); if(!fs.length) return;
    var tgt={}; SLOTS.forEach(function(s){ if(r.nph[s.k]||r.photos[s.k]) tgt[s.k]=1; });
    var tmp={}; Object.keys(tgt).forEach(function(k){ tmp[k]=1; });
    fillSlots(slot,fs,tmp,function(){ Object.keys(tmp).forEach(function(k){ if(tmp[k]!==1){ r.nph[k]=tmp[k]; } }); r.dirty=true; drawSheetBody(); showMsg('📷 '+(i+1)+'행에 사진을 넣었어요. <b>저장</b>을 눌러 주세요.','ok'); });
  });
  tb.addEventListener('change',function(e){
    var el=e.target, i=el.getAttribute('data-r'), k=el.getAttribute('data-k'); if(i==null) return;
    var r=V.sheet[+i], c=SC.filter(function(x){ return x.k===k; })[0], v=el.value;
    if(c.t==='num') v=num(v); else if(c.t==='date') v=normDate(v,MONTH); else v=v.trim();
    r[k]=v; r.dirty=true; r.bad=false;
    if(k==='product'&&!r.ipsu) r.ipsu=ipsuOf(v);
    if(k==='start'&&v&&!r.end) r.end=addDays(v,6);
    if(i==V.sheet.length-1) V.sheet.push(blankSRow());
    drawSheetBody();
  });
  tb.addEventListener('paste',function(e){
    var el=e.target, i=el.getAttribute&&el.getAttribute('data-r'); if(i==null) return;
    var t=(e.clipboardData||window.clipboardData).getData('text'); if(!t||(t.indexOf('\t')<0&&t.indexOf('\n')<0)) return;
    e.preventDefault();
    var lines=t.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(function(l){ return l.split('\t'); });
    var c0=SC.map(function(c){ return c.k; }).indexOf(el.getAttribute('data-k')), r0=+i;
    // 엑셀 머리글('No.', '대리점명') 줄은 건너뜀, 첫 열이 숫자(No.)이고 대리점명 칸에 붙였으면 No. 열 무시
    lines=lines.filter(function(l){ return !/^(No\.?|대리점명)$/.test(String(l[0]).trim())&&!/^대리점명$/.test(String(l[1]||'').trim()); });
    if(c0===0&&lines.length&&lines.every(function(l){ return /^\d+$/.test(String(l[0]).trim())&&l.length>SC.length-2; })) lines=lines.map(function(l){ return l.slice(1); });
    lines.forEach(function(cells,dr){
      while(V.sheet.length<=r0+dr) V.sheet.push(blankSRow());
      var r=V.sheet[r0+dr]; if(r.status==='적합') return;
      cells.forEach(function(v,dc){ var c=SC[c0+dc]; if(!c) return; v=String(v).trim(); if(c.t==='num') v=num(v); else if(c.t==='date') v=normDate(v,MONTH); else if(c.t==='grade') v=GRADES.indexOf(v.toUpperCase())>=0?v.toUpperCase():''; r[c.k]=v; });
      if(!r.ipsu&&r.product) r.ipsu=ipsuOf(r.product);
      r.dirty=true;
    });
    V.sheet.push(blankSRow());
    drawSheetBody(); showMsg('📋 '+lines.length+'행을 붙여넣었어요. 확인 후 <b>저장</b>을 눌러 주세요.','ok');
  });
}
function sheetAdd(n){ for(var i=0;i<n;i++) V.sheet.push(blankSRow()); drawSheetBody(); }
function sheetPhoto(i,slot){ var r=V.sheet[i]; PICK={slot:slot,done:function(p){ r.nph[slot]=p; r.dirty=true; drawSheetBody(); if(p.warn) showMsg('⚠ '+(i+1)+'행 '+SLOTS.filter(function(s){ return s.k===slot; })[0].l+': '+esc(p.warn),'warn'); }}; var el=$('f-alb'); el.value=''; el.click(); }
function sheetDel(i){
  var r=V.sheet[i];
  if(!r.id){ V.sheet.splice(i,1); if(!V.sheet.length) V.sheet.push(blankSRow()); drawSheetBody(); return; }
  if(!confirm((i+1)+'행 \''+r.store+'\' 등록을 삭제할까요?')) return;
  apiPost({action:'fpDel',id:r.id,office:ME.office}).then(function(d){ if(d&&d.success){ V.sheet.splice(i,1); V.rows=(V.rows||[]).filter(function(x){ return x.id!==r.id; }); drawSheetBody(); } else alert((d&&d.msg)||'삭제하지 못했어요'); });
}
function sheetSave(){
  var D=sheetDirty(), bad=[], per=[];
  D.forEach(function(r){ var empty=SC.every(function(c){ return r[c.k]===''||r[c.k]==null; })&&!Object.keys(r.nph).length; if(empty&&!r.id){ r.dirty=false; return; }
    var miss=SC.filter(function(c){ return c.req&&!r[c.k]; }); r.bad=!!miss.length; if(miss.length) bad.push(V.sheet.indexOf(r)+1);
    else if(r.end<r.start||!overlaps(r.start,r.end,MONTH)){ r.bad=true; per.push(V.sheet.indexOf(r)+1); } });
  if(per.length&&!bad.length){ drawSheetBody(); showMsg('빨간 번호 행은 '+mLabel(MONTH)+'에 걸치지 않은 기간이에요 ('+mLabel(MONTH)+' PM은 '+mLabel(MONTH)+'에 하루라도 걸친 전단만): '+per.slice(0,10).join(', ')+'행'); return; }
  if(bad.length){ drawSheetBody(); showMsg('빨간 번호 행에 필수 칸(대리점명·점포명·행사가격·기간·품목명)이 비었어요: '+bad.slice(0,10).join(', ')+'행'); return; }
  var n=0;
  sheetDirty().forEach(function(r){
    var row={id:r.id||'',month:MONTH,office:ME.office,submitter:ME.name,device:DEV}; SC.forEach(function(c){ row[c.k]=r[c.k]; });
    if(!row.ipsu) row.ipsu=ipsuOf(row.product); if(!row.grade) row.grade='A';
    var photos={}; Object.keys(r.nph).forEach(function(k){ photos[k]=photoPayload(r.nph[k]); });
    var cid=r.id||('fp'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+DEV.slice(-3)); r._cid=cid; if(!r.id) row.id='';
    var o={row:row,photos:photos,label:row.store,clientId:cid,at:Date.now()+n,tries:0,state:'wait'};
    qPut(o,function(){ pump(); });
    r.dirty=false; r.saving=true; n++;
  });
  drawSheetBody(); showMsg('✅ '+n+'행을 보냈어요. 상단 표시가 사라지면 저장 완료입니다.','ok');
}

function demoReset(){ if(!confirm('데모 데이터를 지우고 예시 데이터로 다시 시작할까요?')) return; ['fp_demo_rows','fp_demo_seeded'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} }); V.rows=null; V.sheet=null; loadRows(); render(); }

// ═════════ 시작 ═════════
if(ME) lss('fp_me',ME);
apiGet({action:'fpCfg'}).then(function(d){ if(d&&d.cfg){ CFG=Object.assign(CFG,d.cfg); render(); } }).catch(function(){});
loadLists();
render();
if(ME&&ME.name) loadRows();
pump();
window.addEventListener('online',retryAll);
window.addEventListener('dragover',function(e){ e.preventDefault(); });
window.addEventListener('drop',function(e){ e.preventDefault(); });
window.addEventListener('beforeunload',function(e){ if(QINFO.wait||(V.tab==='sheet'&&sheetDirty().length)){ e.preventDefault(); e.returnValue=''; } });
</script>
